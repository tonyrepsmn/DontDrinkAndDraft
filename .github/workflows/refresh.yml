name: Refresh league data
on:
  schedule: [{ cron: '0 12 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node build-data.mjs
      - run: |
          git config user.name "league-bot"; git config user.email "bot@users.noreply.github.com"
          git add data.json; git diff --staged --quiet || (git commit -m "Refresh data" && git push)
